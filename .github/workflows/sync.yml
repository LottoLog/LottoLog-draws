name: sync

on:
  schedule:
    - cron: '30 12 * * 6' # 토 21:30 KST (추첨 20:45)
    - cron: '17 0 * * 0' # 일 09:17 KST, 상금 확정이 늦을 때 재시도
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node sync.mjs
      - name: commit
        run: |
          git diff --quiet draws.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "[chore] $(node -p 'require("./draws.json").at(-1).drwNo')회 당첨 번호"
          git push
      - run: mkdir _site && cp draws.json _site/
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
